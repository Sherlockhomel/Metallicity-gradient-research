name: Publish Metallicity Gradient Research

on:
  push:
    branches: [main]
    paths:
      - site_source.zip
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Read uploaded files
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Unpack the website
        shell: bash
        run: |
          set -euo pipefail
          unzip -tq site_source.zip
          unzip -q site_source.zip -d "${RUNNER_TEMP}/metallicity-site"
          test -f "${RUNNER_TEMP}/metallicity-site/all_proposal_github/index.html"
          mkdir -p "${RUNNER_TEMP}/metallicity-site/all_proposal_github/downloads"
          cp site_source.zip "${RUNNER_TEMP}/metallicity-site/all_proposal_github/downloads/site_source.zip"
      - name: Prepare website for Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/metallicity-site/all_proposal_github
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the website
        id: deployment
        uses: actions/deploy-pages@v4
